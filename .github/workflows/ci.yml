# .github/workflows/ci.yml — CI quality gate
#
# Runs typecheck, lint, build, and CSP check on every push/PR.
# Test files (*.test.ts, __tests__/) are git-ignored and run locally only,
# so CI skips typecheck:tests and vitest steps.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    env:
      # A non-secret placeholder: the build fails loudly when the API endpoint is
      # missing (deployment-architecture.md DL2), so CI must supply one. Real
      # deployments set this in the Cloudflare Pages project environment.
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://script.google.com/macros/s/CI-BUILD-PLACEHOLDER/exec' }}
      VITE_APP_VERSION: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      # Runs AFTER the build on purpose: the check verifies the source
      # `index.html` *and* the built `dist/index.html`, so it catches a bundler
      # rewriting the inline theme bootstrap. Run before the build it would only
      # ever see the source.
      - name: Verify CSP hash for the inline theme bootstrap
        run: npm run csp:check

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist
          retention-days: 7
